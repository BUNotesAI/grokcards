[package]
name = "super-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "super_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keysight-core = { path = "../keysight-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.24", features = [] }
specta-typescript = "0.0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.33", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
rand = "0.9"
# task_dd9e57db Phase 3 新增(spec v2 allowlist):
# - tokio: ServerState 的 oneshot::Sender + JoinHandle;Phase 3 只定义 struct,Phase 4 启 axum 时扩 features
# - toml: cli-config.toml / cli-endpoint.toml 序列化
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net"] }
toml = "0.8"
# Phase 4:HTTP IPC server
axum = "0.8"
tower = "0.5"
subtle = "2"
# Phase 5(spec v2 allowlist 许可):文件系统 watcher
notify = "8"

[dev-dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
# Phase 3 测试用真实 tempdir 做 fixture(不 mock)
tempfile = "3"
